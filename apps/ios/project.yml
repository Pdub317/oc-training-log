name: OCTrainingLog

options:
  bundleIdPrefix: com.ocgymbend
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1

targets:
  OCTrainingLog:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Local.xcconfig
    sources:
      - Sources
    dependencies:
      - package: Supabase
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/OCTrainingLog.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: OC Training Log
        PRODUCT_BUNDLE_IDENTIFIER: com.ocgymbend.traininglog
        SUPPORTS_MACCATALYST: false
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        NSFaceIDUsageDescription: Unlock your private training log.
        CFBundleDisplayName: OC Training Log
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.ocgymbend.traininglog.workout
            CFBundleURLSchemes:
              - octraininglog
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        OCAPIBaseURL: $(API_BASE_URL)
        OCSupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        OCSupabaseURL: $(SUPABASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  OCTrainingLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: OCTrainingLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.ocgymbend.traininglog.tests

schemes:
  OCTrainingLog:
    build:
      targets:
        OCTrainingLog: all
        OCTrainingLogTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - OCTrainingLogTests
